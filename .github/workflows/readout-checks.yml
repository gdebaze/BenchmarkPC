name: Readout tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: for script in js/*.js; do node --check "$script"; done
      - name: Unit tests
        run: node --test tests/*.test.mjs
